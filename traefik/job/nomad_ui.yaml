http:
  middlewares:
    auth:
      basicAuth:
        users:
          - '{{ env "BASIC_AUTH_HASH" }}'

  routers:
    dashboard:
      rule: "Host(`traefik.local`)"
      entryPoints:
        - "https"
      service: api@internal
      middlewares:
        - "auth"
      tls:
        certResolver: "nomadcertresolver"
