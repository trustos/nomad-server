entryPoints:
  http:
    address: ":80"
  https:
    address: ":443"

api:
  dashboard: true
  insecure: false

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

certificatesResolvers:
  nomadcertresolver:
    acme:
      email: trustos@gmail.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: http
